<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14263d" />
    <meta name="description" content="ENG HUB: مهامك وموادك واختباراتك في مكان واحد" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ENG HUB</title>
    <script>
      try {
        var t = localStorage.getItem('enghub.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('enghub.lang');
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
