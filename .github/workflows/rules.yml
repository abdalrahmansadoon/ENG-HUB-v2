name: Test Firestore rules

on:
  push:
    paths: [firestore.rules, tests/rules.test.ts, src/data/firebase.ts, .github/workflows/rules.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-enghub "npm run test:rules"
